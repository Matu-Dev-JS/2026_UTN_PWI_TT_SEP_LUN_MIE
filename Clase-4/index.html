<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- 
    heading
    a (hipervinculos)
    listas ordenadas, desordenadas
    p
    button
    span
    div

    Etiquetas multimedia
    - img
    - video
    - audio
    - iframe (otra pagina web dentro de nuestra pagina)
    -->
    <!-- 
        autoplay: Permite que el video autoinicie (solo si esta muteado)
        muted: El video esta muteado por defecto
        controls: Da al usuario los controles del video (play, pause)
        loop: Hace que se reproduzca en bucle
    -->
    <video src="./assets/videos/video-ejemplo.mp4" autoplay muted loop></video>

    <audio src="./assets/audios/audio-prueba.mp3" controls autoplay muted loop></audio>

    <iframe src="https://guerrin.com.ar/" width="1000px" height="600px"></iframe>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/hMwvi-dCZuo?si=2J_0fmBy552TcZfD" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3284.017148866096!2d-58.38313902716189!3d-34.6037278656548!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4aa9f0a6da5edb%3A0x11bead4e234e558b!2sObelisco!5e0!3m2!1ses-419!2sar!4v1791226463728!5m2!1ses-419!2sar" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
