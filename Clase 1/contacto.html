<!DOCTYPE html><!-- Declara el tipo de documento -->
<html lang="es"> <!-- Determina en que idioma esta la pagina (NO lo cambia, solo informa el idioma al interpretador) -->
<head><!-- Las configuraciones de la pagina -->
    <meta charset="UTF-8"> <!-- Configuracion de caracteres de la pagina -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Determina que el viewport se adapte al ancho del dispositivo -->
    <title>Contactate con nosotros</title><!-- Determina el titulo del documento -->
</head>
<body>
    <!-- Dentro del body podes poner todo el contenido que quieras -->
    <h1>Soy la pagina de contacto!!</h1>
</body>
</html>
